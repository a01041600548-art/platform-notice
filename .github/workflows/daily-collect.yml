name: 공지 자동 수집

on:
  schedule:
    # 매일 22:30 UTC = 07:30 KST (오전 8시 전)
    - cron: '30 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install requests beautifulsoup4 cryptography

      - name: 공지 수집 및 data.enc.json 갱신
        env:
          PN_PASSWORD: ${{ secrets.PN_PASSWORD }}
        run: python3 tools/collector.py

      - name: 캘린더(방미통위 의사일정 + 언론사 수동입력) 갱신
        env:
          PN_PASSWORD: ${{ secrets.PN_PASSWORD }}
        run: python3 tools/build_calendar.py

      - name: 변경사항 커밋 및 푸시
        run: |
          if git diff --quiet -- data.enc.json calendar.enc.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "platform-notice-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.enc.json calendar.enc.json
          git commit -m "공지·캘린더 자동 수집 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
